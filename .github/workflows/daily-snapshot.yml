name: Daily Top 100 HK snapshot

on:
  schedule:
    # 00:00 UTC = 08:00 HKT (Hong Kong has no DST)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      run_year_end:
        description: "Also generate year-end report for the previous calendar year"
        type: boolean
        default: false
      year_end_year:
        description: "Override year for year-end report (empty = previous year)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily snapshot
        env:
          APPLE_MUSIC_TOKEN: ${{ secrets.APPLE_MUSIC_TOKEN }}
        run: python3 scripts/snapshot.py

      - name: Decide whether to run year-end report
        id: year_end
        env:
          TZ: Asia/Hong_Kong
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Hong_Kong date +%Y-%m-%d)"
          DO_YE="false"
          YEAR=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_year_end }}" == "true" ]]; then
            DO_YE="true"
            if [[ -n "${{ inputs.year_end_year }}" ]]; then
              YEAR="${{ inputs.year_end_year }}"
            else
              YEAR="$(TZ=Asia/Hong_Kong date -d 'yesterday' +%Y 2>/dev/null || python3 -c 'from datetime import date; d=date.today(); print(d.year-1 if (d.month,d.day)==(1,1) else d.year-1)')"
              # Prefer previous calendar year for manual year-end
              YEAR="$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo('Asia/Hong_Kong')); print(n.year-1)")"
            fi
          elif [[ "$(TZ=Asia/Hong_Kong date +%m-%d)" == "01-01" ]]; then
            DO_YE="true"
            YEAR="$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo('Asia/Hong_Kong')); print(n.year-1)")"
          fi
          echo "run=${DO_YE}" >> "$GITHUB_OUTPUT"
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"
          echo "today_hkt=${TODAY}" >> "$GITHUB_OUTPUT"

      - name: Year-end report
        if: steps.year_end.outputs.run == 'true'
        run: python3 scripts/year_end_report.py --year "${{ steps.year_end.outputs.year }}"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          DATE="$(python3 -c "import json; print(json.load(open('data/latest.json'))['snapshot_date'])")"
          MSG="chore: snapshot Top 100 HK ${DATE}"
          if [[ -n "$(git diff --staged --name-only | grep '^data/reports/' || true)" ]]; then
            MSG="${MSG} (+ year-end report)"
          fi
          git commit -m "${MSG}"
          git push

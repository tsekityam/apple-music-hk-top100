name: Daily Top 100 HK snapshot

on:
  schedule:
    # 00:00 UTC = 08:00 HKT (Hong Kong has no DST)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      run_year_end:
        description: "Also generate year-end report for the previous calendar year"
        type: boolean
        default: false
      year_end_year:
        description: "Override year for year-end report (empty = previous year)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily snapshot
        env:
          APPLE_MUSIC_TOKEN: ${{ secrets.APPLE_MUSIC_TOKEN }}
        run: python3 scripts/snapshot.py

      - name: Decide whether to run year-end report
        id: year_end
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_YEAR_END: ${{ inputs.run_year_end }}
          INPUT_YEAR: ${{ inputs.year_end_year }}
        run: |
          set -euo pipefail
          HKT_MD="$(TZ=Asia/Hong_Kong date +%m-%d)"
          PREV_YEAR="$(TZ=Asia/Hong_Kong date +%Y)"
          # On Jan 1, previous calendar year is current_year - 1
          PREV_YEAR="$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; n=datetime.now(ZoneInfo('Asia/Hong_Kong')); print(n.year-1)")"
          DO_YE=false
          YEAR=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_RUN_YEAR_END}" == "true" ]]; then
            DO_YE=true
            if [[ -n "${INPUT_YEAR}" ]]; then
              YEAR="${INPUT_YEAR}"
            else
              YEAR="${PREV_YEAR}"
            fi
          elif [[ "${HKT_MD}" == "01-01" ]]; then
            DO_YE=true
            YEAR="${PREV_YEAR}"
          fi
          echo "run=${DO_YE}" >> "$GITHUB_OUTPUT"
          echo "year=${YEAR}" >> "$GITHUB_OUTPUT"
          echo "today_hkt=$(TZ=Asia/Hong_Kong date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Year-end report
        if: steps.year_end.outputs.run == 'true'
        run: python3 scripts/year_end_report.py --year "${{ steps.year_end.outputs.year }}"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          DATE="$(python3 -c "import json; print(json.load(open('data/latest.json'))['snapshot_date'])")"
          MSG="chore: snapshot Top 100 HK ${DATE}"
          if [[ -n "$(git diff --staged --name-only | grep '^data/reports/' || true)" ]]; then
            MSG="${MSG} (+ year-end report)"
          fi
          git commit -m "${MSG}"
          git push
